<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Lekker Italia</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--bg) 0%,var(--bg-warm) 60%,#f0e0d0 100%); padding:2rem; }
.auth-box { background:#fff; border-radius:var(--radius); padding:2.5rem; max-width:420px; width:100%; box-shadow:var(--shadow-lg); }
.auth-box .logo { display:block; text-align:center; font-family:'Playfair Display',serif; font-size:1.6rem; color:var(--primary); text-decoration:none; margin-bottom:.5rem; }
.auth-box > p { text-align:center; color:var(--text-light); font-size:.9rem; margin-bottom:1.5rem; }
.auth-box h2 { text-align:center; font-size:1.4rem; margin-bottom:1.2rem; }
.auth-toggle { text-align:center; margin-top:1.2rem; font-size:.85rem; color:var(--text-light); }
.auth-toggle a { color:var(--primary); font-weight:600; cursor:pointer; }
.auth-msg { font-size:.82rem; margin-top:.5rem; min-height:1.2rem; text-align:center; }
.auth-msg.error { color:#c0392b; }
.auth-msg.success { color:#27ae60; }
</style>
</head>
<body>

<nav id="navbar" class="scrolled">
  <div class="nav-wrap">
    <a href="index.html" class="logo">Lekker Italia</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="booking.html">Book a Table</a></li>
      <li><a href="order.html">Order Online</a></li>
    </ul>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-box">
    <a href="index.html" class="logo">Lekker Italia</a>
    <p>Cape Town's authentic Italian kitchen</p>

    <!-- Login -->
    <div id="login-panel">
      <h2>Sign In</h2>
      <p style="text-align:center;color:var(--text-light);font-size:.88rem;margin-bottom:1.2rem;">Access your bookings and order history</p>
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="Your password"></div>
      <div class="auth-msg" id="login-msg"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Sign In</button>
      <div class="auth-toggle">No account? <a onclick="showPanel('signup')">Create one</a></div>
    </div>

    <!-- Sign Up -->
    <div id="signup-panel" style="display:none">
      <h2>Create Account</h2>
      <p style="text-align:center;color:var(--text-light);font-size:.88rem;margin-bottom:1.2rem;">Join for exclusive offers and faster checkout</p>
      <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" placeholder="John Doe"></div>
      <div class="form-group"><label>Email</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="signup-password" placeholder="Min 6 characters"></div>
      <div class="auth-msg" id="signup-msg"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="doSignup()">Create Account</button>
      <div class="auth-toggle">Already have an account? <a onclick="showPanel('login')">Sign in</a></div>
    </div>
  </div>
</div>

<script src="https://sdk.amazonaws.com/js/aws-sdk-2.1000.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.4/dist/amazon-cognito-identity.min.js"></script>
<script src="js/auth.js"></script>
<script>
function showPanel(p) {
  document.getElementById('login-panel').style.display = p==='login'?'block':'none';
  document.getElementById('signup-panel').style.display = p==='signup'?'block':'none';
  document.querySelectorAll('.auth-msg').forEach(m=>m.textContent='');
}
// If already logged in, redirect
if (localStorage.getItem('lekkerItalia_user')) {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
